# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely edit after that. If you find
# yourself editing this file very often, consider using Jekyll's data files
# feature for the data you need to update frequently.
#
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'bundle exec jekyll serve'. If you change this file, please restart the server process.

# Site settings
# These are used to personalize your new site. If you look in the HTML files,
# you will see them accessed via {{ site.title }}, {{ site.email }}, and so on.
# You can create any custom variable you would like, and they will be accessible
# in the templates via {{ site.myvariable }}.

# theme: jekyll-theme-so-simple
remote_theme: "mmistakes/so-simple-theme@3.2.0"
skin: "/assets/css/skins/dark.css"
locale: en-US
title: "Height Above Sea Level"
description: "Game development using Unity and C#."
baseurl: # the subpath of your site, e.g. "/blog"
url: # the base hostname & protocol for your site e.g. "https://mmistakes.github.io"
logo: /assets/images/hasl_logo_square_black_bg.jpg # path of site logo, e.g. "/images/logo.png"
date_format: "%B %-d, %Y"
read_time: true
words_per_minute: 200
google_fonts:
  - name: "Source Sans Pro"
    weights: "400,400i,700,700i"
  - name: "Lora"
    weights: "400,400i,700,700i"
google_analytics: # Google Analytics id, e.g. "UA-NNNNNNNN-N"
twitter:
  username: Vicktor_Oti # site's Twitter username, e.g. "mmistakes"

# Liquid
liquid:
  error_mode: strict

# Build settings
permalink: /:categories/:title/
markdown: kramdown
feed:
  path: atom.xml

# Pagination - https://jekyllrb.com/docs/pagination/
paginate: 10
paginate_path: /page:num/

# Search
search_full_content: false # can have performance implications for large sites

# Taxonomy pages
category_archive_path: "/categories/#"
tag_archive_path: "/tags/#"

# Exclude from processing.
# The following items will not be processed, by default. Create a custom list
# to override the default setting.
# exclude:
#   - Gemfile
#   - Gemfile.lock
#   - node_modules
#   - vendor/bundle/
#   - vendor/cache/
#   - vendor/gems/
#   - vendor/ruby/

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-paginate

# Front Matter Defaults
defaults:
  # Posts defaults
  - scope:
      path: "_posts"
      type: posts
    values:
      layout: post
      share: true

# Site Author
author:
  name: Victor Nyagudi
  picture: /assets/images/victor_author_img.jpg
  email:
  twitter: LeonardoDaVicki
  links:
    - title: Patreon
      url: https://patreon.com/heightabovesealevel
      icon: fab fa-patreon
    - title: YouTube
      url: https://www.youtube.com/@HeightAboveSeaLevel
      icon: fab fa-youtube
    - title: Twitter
      url: https://x.com/Vicktor_Oti
      icon: fab fa-x-twitter

# Footer Links
footer_links:
  - title: Patreon
    url: https://patreon.com/heightabovesealevel
    icon: fab fa-patreon
  - title: Twitter
    url: https://x.com/Vicktor_Oti
    icon: fab fa-x-twitter
  - title: YouTube
    url: https://www.youtube.com/@HeightAboveSeaLevel
    icon: fab fa-youtube
  - title: Instagram
    url: https://www.instagram.com/HeightAboveSeaLevel/
    icon: fab fa-instagram
